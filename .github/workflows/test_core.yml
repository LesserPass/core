name: Test Core functionality

on:
  pull_request:
    branches:
      - main
    paths:
      - 'core.js'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run core functionality tests
        run: node tests/core.js